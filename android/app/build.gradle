plugins {
    id 'com.android.application'
}

def diagnosticsEndpoint = project.findProperty('linkpasDiagnosticsEndpoint') ?: 'https://ignmxvommfnkllcpliuw.supabase.co/functions/v1/linkpas-diagnostics'

android {
    namespace 'id.barangpas.linkpas'
    compileSdk 36

    defaultConfig {
        applicationId 'id.barangpas.linkpas'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0-beta'
        buildConfigField 'String', 'DIAGNOSTICS_ENDPOINT', '"' + diagnosticsEndpoint + '"'
        buildConfigField 'String', 'DIAGNOSTICS_PUBLISHABLE_KEY', '"sb_publishable_CzSU2cNRiNUY7qZzCv77QQ_jGEdaBQ3"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
    testImplementation 'junit:junit:4.13.2'
}
