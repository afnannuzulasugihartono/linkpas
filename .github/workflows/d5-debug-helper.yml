name: D5 Windows Debug Helper

on:
  pull_request:
    branches: [main]
    paths:
      - 'LINKPAS-Debug.bat'
      - 'tests/debug-helper.test.js'
      - '.github/workflows/d5-debug-helper.yml'
  push:
    branches: [main]
    paths:
      - 'LINKPAS-Debug.bat'
      - 'tests/debug-helper.test.js'
      - '.github/workflows/d5-debug-helper.yml'

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  windows-helper-smoke:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Create bounded fake ADB
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force fakebin | Out-Null
          @'
          @echo off
          if "%1"=="start-server" exit /b 0
          if "%1"=="devices" (
            echo List of devices attached
            echo fake-device device
            exit /b 0
          )
          if "%1"=="version" (
            echo Android Debug Bridge version 1.0.41
            exit /b 0
          )
          if "%1"=="get-state" (
            echo device
            exit /b 0
          )
          if "%1"=="shell" (
            if "%2"=="pm" if "%3"=="path" (
              echo package:/data/app/id.barangpas.linkpas/base.apk
              exit /b 0
            )
            if "%2"=="pm" if "%3"=="get-app-links" (
              echo id.barangpas.linkpas:
              echo   linkpas.vercel.app: verified
              exit /b 0
            )
            if "%2"=="dumpsys" if "%3"=="package" (
              echo Package [id.barangpas.linkpas]
              echo versionName=0.1.0-beta
              echo versionCode=1
              echo linkpas.vercel.app verified
              echo com.google.androidbrowserhelper.trusted.ManageDataLauncherActivity enabled=true
              exit /b 0
            )
            if "%2"=="dumpsys" if "%3"=="activity" (
              echo id.barangpas.linkpas linkpas.vercel.app
              exit /b 0
            )
            if "%2"=="pidof" (
              echo 1234
              exit /b 0
            )
          )
          if "%1"=="logcat" (
            echo 09-15 00:00:00.000 1234 1234 I LINKPAS: id.barangpas.linkpas TrustedWebActivity
            exit /b 0
          )
          exit /b 0
          '@ | Set-Content -Encoding ascii fakebin\adb.exe.cmd
          Copy-Item fakebin\adb.exe.cmd fakebin\adb.cmd
          "${PWD}\fakebin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run helper end-to-end with fake ADB
        shell: cmd
        run: echo.| call LINKPAS-Debug.bat

      - name: Verify bounded ZIP contents
        shell: pwsh
        run: |
          $zip = Get-ChildItem 'LINKPAS-Debug-*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'No LINKPAS debug ZIP was produced.' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath extracted -Force
          $required = @(
            'README.txt',
            'adb-version.txt',
            'device-state.txt',
            'package-path.txt',
            'app-links.txt',
            'package-app-links.txt',
            'activity.txt',
            'wrapper-logcat.txt',
            'system-filtered-logcat.txt'
          )
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path 'extracted' $name))) { throw "Missing $name" }
          }
          if (Test-Path 'extracted\devices.txt') { throw 'Device serial inventory must not be stored.' }
