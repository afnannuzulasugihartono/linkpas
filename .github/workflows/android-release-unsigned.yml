name: Android Release APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-release-unsigned.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build unsigned release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease

      - name: Collect release signing tool
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -f "$APK"
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER_JAR"
          mkdir -p release-input
          cp "$APK" release-input/app-release-unsigned.apk
          cp "$APKSIGNER_JAR" release-input/apksigner.jar
          printf '%s\n' 'gradle --no-daemon :app:assembleRelease' > release-input/build-command.txt

      - name: Upload unsigned release input
        uses: actions/upload-artifact@v4
        with:
          name: linkpas-release-unsigned
          path: release-input/
          if-no-files-found: error
          retention-days: 7
