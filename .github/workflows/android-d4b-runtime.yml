name: Android D4b Runtime Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-d4b-runtime.yml'
      - '.github/scripts/d4b-runtime.sh'
      - 'android/app/src/main/java/id/barangpas/linkpas/NativeDiagnostics.java'
      - 'android/app/src/main/java/id/barangpas/linkpas/NativeDiagnosticTransport.java'

permissions:
  contents: read

jobs:
  validate-native-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run controlled native diagnostic on Android emulator
        id: runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server 8.8.8.8,1.1.1.1
          script: bash .github/scripts/d4b-runtime.sh

      - name: Upload D4b report ID evidence
        uses: actions/upload-artifact@v4
        with:
          name: linkpas-d4b-report-id
          path: d4b-report-id.txt
          if-no-files-found: error
          retention-days: 7
