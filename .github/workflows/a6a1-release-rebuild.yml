name: A6a1 Release Rebuild

on:
  push:
    branches: [chore/a6a1-release-rebuild]

permissions:
  contents: read

jobs:
  rebuild-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Android unit tests
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build unsigned release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease

      - name: Collect A6a1 signing input
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -f "$APK"
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER_JAR"
          mkdir -p a6a1-input
          cp "$APK" a6a1-input/app-release-unsigned.apk
          cp "$APKSIGNER_JAR" a6a1-input/apksigner.jar
          git rev-parse HEAD > a6a1-input/source-commit.txt
          git rev-parse HEAD^{tree} > a6a1-input/source-tree.txt

      - name: Upload A6a1 release input
        uses: actions/upload-artifact@v4
        with:
          name: a6a1-release-input
          path: a6a1-input/
          if-no-files-found: error
          retention-days: 2
